schema = 1
project = "cnry"

# Gates from evidenced source (see review); no full-test claims beyond these.
[checks.verify]
kind = "commands"
commands = [
  ["cargo", "fmt", "--all", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"]]
cache_outputs = []

[render]
render_schema = 2
[jobs.verify]
scheduler = "forgejo"
runs_on = "linux"
checks = ["verify"]
workflow = "ci"
command = ["ccid:run-declared-checks"]

[runtime]
tools = []
install_root = true

[toolchain]
